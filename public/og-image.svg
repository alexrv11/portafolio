<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#1A1210"/>

  <!-- Subtle grid texture -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFF4EC" stroke-width="0.3" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ember glow -->
  <radialGradient id="glow" cx="50%" cy="45%" r="40%">
    <stop offset="0%" stop-color="#FF7A45" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#1A1210" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark (stacked, centered) — scaled up 3× from 120 grid = 360px box, centered at 600,220 -->
  <g transform="translate(480, 100) scale(2)">
    <circle cx="38" cy="60" r="22" fill="none" stroke="#FFF4EC" stroke-width="10"/>
    <path d="M60 38 L60 82" fill="none" stroke="#FFF4EC" stroke-width="10" stroke-linecap="round"/>
    <path d="M60 38 L80 82 L100 38" fill="none" stroke="#FF7A45" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark "alex ventura" -->
  <text
    x="600" y="390"
    text-anchor="middle"
    font-family="'Space Grotesk', system-ui, sans-serif"
    font-size="64"
    font-weight="700"
    letter-spacing="2"
    fill="#FFF4EC"
  >alex ventura</text>

  <!-- Label "SOFTWARE ENGINEER" -->
  <text
    x="600" y="440"
    text-anchor="middle"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="16"
    font-weight="500"
    letter-spacing="6"
    fill="#A8968A"
  >SOFTWARE ENGINEER</text>

  <!-- Skills row -->
  <text
    x="600" y="530"
    text-anchor="middle"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="14"
    font-weight="500"
    letter-spacing="3"
    fill="#FF7A45"
    opacity="0.85"
  >Golang · TypeScript · React · AWS · 14+ years</text>

  <!-- Domain -->
  <text
    x="600" y="590"
    text-anchor="middle"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="13"
    letter-spacing="2"
    fill="#3A2B24"
  >alex.ventulab.com</text>
</svg>
